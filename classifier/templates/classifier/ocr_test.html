<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Model Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-input-label {
            display: block;
            padding: 12px 20px;
            background: #f0f0f0;
            border: 2px dashed #667eea;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            color: #667eea;
            font-weight: 500;
        }
        
        .file-input-label:hover {
            background: #e8e8ff;
            border-color: #764ba2;
        }
        
        .file-name {
            margin-top: 8px;
            color: #666;
            font-size: 13px;
        }
        
        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 15px;
        }
        
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }
        
        .radio-option label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            color: #555;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }
        
        .reset-btn:hover {
            background: #d0d0d0;
        }
        
        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .result-header h2 {
            color: #333;
            font-size: 18px;
        }
        
        .model-badge {
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .result-text {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            padding: 15px;
            color: #333;
            line-height: 1.8;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }
        
        .page-section {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }
        
        .page-section:last-child {
            border-bottom: none;
        }
        
        .page-header {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 13px;
        }
        
        .page-content {
            background: white;
            padding: 12px;
            border-left: 3px solid #667eea;
            border-radius: 3px;
        }
        
        .text-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding: 12px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 13px;
            color: #666;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .stat-label {
            font-weight: 600;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 12px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .copy-btn {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .copy-btn:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 OCR Model Tester</h1>
        
        <form id="ocrForm">
            <!-- File Upload -->
            <div class="form-group">
                <label>Select File (Image, PDF, or ZIP)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" accept="image/*,.pdf,.zip" required>
                    <label for="fileInput" class="file-input-label">
                        📁 Click to select or drag & drop (PNG, JPG, PDF, ZIP)
                    </label>
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>
            
            <!-- OCR Model Selection -->
            <div class="form-group">
                <label>Select OCR Model</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="tesseract" name="ocr_model" value="tesseract" checked>
                        <label for="tesseract">Tesseract</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="paddle" name="ocr_model" value="paddle">
                        <label for="paddle">PaddleOCR</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="surya" name="ocr_model" value="surya">
                        <label for="surya">Surya</label>
                    </div>
                </div>
            </div>
            
            <!-- Buttons -->
            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">Extract Text</button>
                <button type="reset" class="reset-btn" id="resetBtn">Clear</button>
            </div>
        </form>
        
        <!-- Loading Indicator -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing image...</p>
        </div>
        
        <!-- Error Message -->
        <div class="error" id="error"></div>
        
        <!-- Results -->
        <div class="result-section" id="resultSection">
            <div class="result-header">
                <h2>Extracted Text</h2>
                <div>
                    <span class="model-badge" id="modelBadge"></span>
                    <span id="pageInfo" style="margin-left: 10px; color: #666; font-size: 13px;"></span>
                    <span id="timeInfo" style="margin-left: 10px; color: #666; font-size: 13px;"></span>
                    <button type="button" class="copy-btn" id="copyBtn">📋 Copy</button>
                </div>
            </div>
            <div class="result-text" id="resultText"></div>
            <div class="text-stats">
                <div class="stat-item">
                    <span class="stat-label">Characters:</span>
                    <span id="charCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Words:</span>
                    <span id="wordCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Lines:</span>
                    <span id="lineCount">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Pages:</span>
                    <span id="pageCount">0</span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('ocrForm');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultSection = document.getElementById('resultSection');
        const resultText = document.getElementById('resultText');
        const modelBadge = document.getElementById('modelBadge');
        const copyBtn = document.getElementById('copyBtn');
        const submitBtn = document.getElementById('submitBtn');
        const pageInfo = document.getElementById('pageInfo');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const lineCount = document.getElementById('lineCount');
        const pageCount = document.getElementById('pageCount');
        const timeInfo = document.getElementById('timeInfo');
        
        // File input change handler
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileName.textContent = `Selected: ${e.target.files[0].name}`;
            }
        });
        
        // Drag and drop
        const fileLabel = document.querySelector('.file-input-label');
        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.style.background = '#e8e8ff';
        });
        
        fileLabel.addEventListener('dragleave', () => {
            fileLabel.style.background = '#f0f0f0';
        });
        
        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.style.background = '#f0f0f0';
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                fileName.textContent = `Selected: ${e.dataTransfer.files[0].name}`;
            }
        });
        
        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!fileInput.files.length) {
                showError('Please select a file');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('ocr_model', document.querySelector('input[name="ocr_model"]:checked').value);
            
            loading.classList.add('show');
            error.classList.remove('show');
            resultSection.classList.remove('show');
            submitBtn.disabled = true;
            
            try {
                const response = await fetch('/extract', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    showError(data.error || 'An error occurred');
                } else {
                    displayResults(data);
                }
            } catch (err) {
                showError('Network error: ' + err.message);
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        });
        
        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultText.textContent).then(() => {
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✓ Copied!';
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                }, 2000);
            });
        });
        
        // Reset form
        document.getElementById('resetBtn').addEventListener('click', () => {
            fileName.textContent = '';
            resultSection.classList.remove('show');
            error.classList.remove('show');
        });
        
        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }
        
        function displayResults(data) {
            // Format text with page sections
            const pages = data.text.split('--- Page/Image');
            let formattedHtml = '';
            
            pages.forEach((page, index) => {
                if (page.trim()) {
                    const pageNum = index + 1;
                    const pageText = page.replace(/^.*?---\n/, '').trim();
                    formattedHtml += `
                        <div class="page-section">
                            <div class="page-header">📄 Page ${pageNum}</div>
                            <div class="page-content">${escapeHtml(pageText)}</div>
                        </div>
                    `;
                }
            });
            
            resultText.innerHTML = formattedHtml;
            
            // Update stats
            const fullText = data.text;
            const chars = fullText.length;
            const words = fullText.trim().split(/\s+/).filter(w => w.length > 0).length;
            const lines = fullText.split('\n').length;
            
            charCount.textContent = chars.toLocaleString();
            wordCount.textContent = words.toLocaleString();
            lineCount.textContent = lines.toLocaleString();
            pageCount.textContent = data.pages;
            
            modelBadge.textContent = data.model.toUpperCase();
            pageInfo.textContent = `(${data.pages} page${data.pages > 1 ? 's' : ''})`;
            timeInfo.textContent = `⏱️ ${data.processing_time}s`;
            resultSection.classList.add('show');
        }
        
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
